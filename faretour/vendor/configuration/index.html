    <style>
        body{
            background-color: whitesmoke;
        }
    </style>

<body>
    <div class="v_profile_container">
       <div class="banner">
            <br><br><br><br><br>
            <div class="r">R</div>
       </div>
       <br><br>
       <div class="container">
            <div class="actionBtns">
                <button>Restaurant detail</button><button class="active">Configuration</button>
            </div>
            <div class="form">
                <h4>Edit profile</h4>
                <form action="">
                    <div class="up">
                        <div class="reg_layout">
                            <small>Upload logo</small><br>
                            <label for="up_pic"><button type="button"><i class="fa-solid fa-circle-plus"></i></button></label>
                            <input type="file" id="up_pic" style="display: none;">
                        </div>
                        <div class="reg_layout">
                            <small>Upload banner</small><br>
                            <label for="up_banner"><button type="button" style="width: 150px;"><i class="fa-solid fa-circle-plus"></i></button></label>
                            <input type="file" id="up_banner" style="display: none;">
                        </div>
                    </div>
                    <div class="new_food">
                        <h4>Add new food <span>+</span></h4>
                        <select name="" id="">
                            <option value="">Select menu</option>
                            <option value="">Rice</option>
                            <option value="">Meat</option>
                            <option value="">Bakeries</option>
                        </select>
                        <div class="add_photos">
                            <button><div class="addPic">+Add Photo</div></button>
                            <button><div class="addPic">+Add Photo</div></button>
                            <button><div class="addPic">+Add Photo</div></button>
                        </div>
                        <h5>Description</h5>
                        <div class="description">
                            <span>Name:</span><br>
                            <span>Price:</span><br>
                            <span>Details:</span>
                        </div>
                    </div>
                    <button>Upload</button>
                </form>
            </div>
        </div>
        <br><br>
    </div>
