        body{

<body>

    <div class="container cu_sign_container">
        <h2>Welcome to FOOD FARE</h2>
        <span>Create a new account</span>
        <br><br><br>
        <div class="cu_inp_sec">
            <div class="cu_inp_grp">
                <input type="text" placeholder="Name" required>
            </div>
            <div class="cu_inp_grp">
                <select name="" id="tel_sel">
                    <option value="">+234</option>
                </select>
                <input type="number" id="tel_inp" required>
            </div>
            <div class="cu_inp_grp">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="cu_inp_grp">
                <input type="password" placeholder="Confirm Password" required>
            </div>
            <div class="cu_inp_btn">
                <a href="./otp.html"><button>Sign Up</button></a>
            </div>
            <div class="cu_others">
                <span>Already have an account? <a href="../customer_signin/index.html" style="color: #FFB703;">Login</a></span>
                <br>
                <div class="cu_or">
                    <hr> <b>OR</b><hr>
                </div>
                <br>
                <div class="cu_ga_icons">
                    <img src="../assets/images/google.svg" alt="">
                    <img src="../assets/images/apple.svg" alt="">
                </div>
            </div>
        </div>
    </div>
   
</body>
